name: Build Android APK

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
      - "scripts/prepare-*.mjs"
      - "package*.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/main.yml"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "src/**"
      - "public/**"
      - "scripts/prepare-*.mjs"
      - "package*.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, lint and verify Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Optional PUBLIC origin of the complete HTTPS app + same-origin /api.
      # Empty means an explicitly labelled device-only demo, not fake sign-in.
      OMR_ANDROID_SERVER_URL: ${{ vars.ANDROID_SERVER_URL }}
      OMR_ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "21"
          distribution: temurin
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Validate wrapper and cache Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install locked web and Capacitor dependencies
        run: npm ci
      - name: Frontend and native-bridge regressions
        run: npm test
      - name: Build bundled web assets and synchronize the Android project
        run: npm run android:sync
      - name: Compile APK, run JVM tests and Android lint
        working-directory: android
        run: |
          mkdir -p ../.cache/android
          test -x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace testDebugUnitTest lintDebug assembleDebug 2>&1 | tee ../.cache/android/gradle.log
      - name: Verify signed APK and stage download
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee .cache/android/apk-manifest.txt
          grep -q "package: name='com.markly.omrpro.debug'" .cache/android/apk-manifest.txt
          grep -q "sdkVersion:'24'" .cache/android/apk-manifest.txt
          grep -q "targetSdkVersion:'36'" .cache/android/apk-manifest.txt
          grep -q "launchable-activity:" .cache/android/apk-manifest.txt
          mkdir -p .cache/android/apk
          cp "$apk" .cache/android/apk/omr-checker-ai-pro-debug.apk
          (cd .cache/android/apk && sha256sum omr-checker-ai-pro-debug.apk > SHA256SUMS.txt)
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('android/app/src/main/assets/capacitor.config.json', 'utf8'));
          const mode = config.server?.url ? `Hosted school app: ${config.server.url}` : 'Device-only demo. No school backend is configured.';
          const info = `OMR Checker AI Pro — DEBUG TEST BUILD\nCommit: ${process.env.GITHUB_SHA}\nRun: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\nAndroid 7.0 / API 24 or newer; current Android System WebView required.\n${mode}\nPython/PostgreSQL are not embedded. This is not a Play Store release.\nCompilation, JVM tests and lint do not certify physical camera/scanner/device behavior.\nBack up local work before replacing an APK signed by a different debug key.\n`;
          fs.writeFileSync('.cache/android/apk/BUILD-INFO.txt', info);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Android debug APK\n\n${info}\n\nDownload the **omr-checker-android-debug** artifact below.\n`);
          JS
      - name: Upload verified debug APK and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omr-checker-android-debug
          path: .cache/android/apk/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain Android test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-qa-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*
            .cache/android/gradle.log
            .cache/android/apk-manifest.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize native build failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.cache/android/gradle.log')
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              # Only synthetic build diagnostics, never school data or .env files.
              important = [line for line in lines if any(word in line for word in ('error:', 'What went wrong', 'Execution failed', 'Could not', 'FAILURE:', 'Error:', 'error:'))]
              tail = ('\n'.join(important[:35] + lines[-35:])).encode()[-14000:]
              for start in range(0, len(tail), 2800):
                  message = tail[start:start + 2800].decode(errors='replace')
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::warning title=Android build diagnostics::{message}')
          PY
