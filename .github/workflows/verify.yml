name: Verify OMR enterprise

on:
  pull_request:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omr-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Unit, PostgreSQL, genuine CV and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: omr_test
          POSTGRES_PASSWORD: ci-disposable-test-only
          POSTGRES_DB: omr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omr_test -d omr_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Disposable CI credentials, never an institution/production database.
      OMR_TEST_POSTGRES_URL: postgresql://omr_test:ci-disposable-test-only@127.0.0.1:5432/omr_test
      OMR_E2E_ALLOW_SETUP: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          npm ci
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.lock
          npx playwright install --with-deps chromium
          mkdir -p .cache/qa
      - name: Formatting and Python lint
        run: |
          npm run format:check
          .venv/bin/ruff check backend scripts
          .venv/bin/ruff format --check backend scripts
      - name: Frontend and preserved Node tests
        run: npm run test:all
      - name: SQLite, PostgreSQL, migration/recovery and genuine native OpenCV
        run: .venv/bin/pytest -q backend/tests --junitxml=.cache/qa/python-results.xml
      - name: TypeScript and production PWA build
        run: npm run build
      - name: Authenticated browser, genuine offline PDF scan and synchronization
        run: npm run test:e2e
      - name: Dependency checks
        run: |
          npm audit --audit-level=low
          .venv/bin/pip check
          .venv/bin/bandit -r backend -x backend/tests,backend/migrations
          .venv/bin/pip-audit -r backend/requirements.lock --require-hashes --disable-pip --vulnerability-service pypi
          .venv/bin/pip-audit -r backend/requirements-dev.lock --require-hashes --disable-pip --vulnerability-service pypi
      - name: Retain synthetic QA failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-qa-evidence
          path: |
            .cache/qa/e2e-artifacts/
            .cache/qa/python-results.xml
          retention-days: 7
          # Only the two explicit synthetic-evidence paths above, not private QA DBs.
          include-hidden-files: true
          if-no-files-found: ignore

  container:
    name: Enterprise image, production migrations and container health
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_DOMAIN: omr-ci.example.invalid
      ACME_EMAIL: qa@example.org
      # Isolated containers/volumes; not published or used for school data.
      POSTGRES_PASSWORD: ci-disposable-app-only
      POSTGRES_ADMIN_PASSWORD: ci-disposable-admin-only
      SETUP_TOKEN: ci-disposable-bootstrap-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate disposable encryption key
        run: |
          python3 -c 'import base64,secrets; print("BACKUP_KEY=" + base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())' >> "$GITHUB_ENV"
      - name: Build enterprise runtime and validate Compose
        run: |
          docker compose --env-file .env.example -f deployment/compose.yaml config --quiet
          docker compose --env-file .env.example -f deployment/compose.yaml build api
      - name: Validate HTTPS reverse-proxy configuration
        run: >-
          docker run --rm -e APP_DOMAIN -e ACME_EMAIL
          -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Initialize isolated PostgreSQL and apply Alembic migrations
        run: |
          docker compose --env-file .env.example -f deployment/compose.yaml up -d --wait db
          docker compose --env-file .env.example -f deployment/compose.yaml run --rm migrate
          docker compose --env-file .env.example -f deployment/compose.yaml up -d --wait api
      - name: Verify non-root runtime, PostgreSQL connection, OCR and encrypted storage
        run: |
          docker compose --env-file .env.example -f deployment/compose.yaml exec -T api python - <<'PY'
          import json, os, shutil, urllib.request
          from sqlalchemy import text
          from backend.config import Settings
          from backend.db import engine_for
          from backend.object_store import ObjectStore
          assert os.getuid() == 10001
          assert shutil.which("tesseract")
          with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=10) as response:
              assert json.load(response)["storage"] == "postgresql"
          settings = Settings()
          engine = engine_for(settings)
          with engine.connect() as connection:
              assert not connection.scalar(text("SELECT rolsuper FROM pg_roles WHERE rolname=current_user"))
          engine.dispose()
          store = ObjectStore(settings)
          store.put("qa/smoke.enc", b"synthetic smoke test", encrypt=True)
          assert store.get("qa/smoke.enc", decrypt=True) == b"synthetic smoke test"
          store.delete("qa/smoke.enc")
          print("Non-root production container, native OCR, database and encryption checks passed.")
          PY
      - name: Inspect failures
        if: failure()
        run: docker compose --env-file .env.example -f deployment/compose.yaml logs --no-color --tail=120
      - name: Remove disposable CI services and volumes
        if: always()
        run: docker compose --env-file .env.example -f deployment/compose.yaml down --volumes --remove-orphans
